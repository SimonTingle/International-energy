name: Auto-fix npm Vulnerabilities

on:
  schedule:
    # Run daily to check for new vulnerabilities
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allow manual trigger from Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-fix:
    name: Run npm audit fix & create PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: audit
        run: npm audit 2>&1 | tee audit-output.txt || true

      - name: Check for vulnerabilities
        id: check
        run: |
          if npm audit --audit-level=moderate > /dev/null 2>&1; then
            echo "has_vulns=false" >> $GITHUB_OUTPUT
          else
            echo "has_vulns=true" >> $GITHUB_OUTPUT
          fi

      - name: Auto-fix vulnerabilities
        if: steps.check.outputs.has_vulns == 'true'
        run: |
          echo "🔧 Found vulnerabilities, attempting auto-fix..."
          npm audit fix --audit-level=moderate || npm audit fix --force
          echo "✅ Auto-fix completed"

      - name: Check if there are changes
        id: changes
        run: |
          git diff --exit-code package-lock.json > /dev/null
          if [ $? -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: npm audit fix - resolve security vulnerabilities'
          title: '🔒 Security: npm audit fix for dependencies'
          body: |
            ## Security Update

            This PR contains dependency updates from `npm audit fix` to address security vulnerabilities.

            ### Changes
            - Updated packages to latest secure versions
            - Resolved high/moderate/low severity vulnerabilities

            ### Testing
            Please test before merging:
            ```bash
            npm ci
            npm run build
            npm run lint
            ```

            ---
            *Generated by npm audit fix workflow*
          branch: security/npm-audit-fix
          delete-branch: true
          labels: security, dependencies, auto-generated

      - name: Comment on PR if audit is clean
        if: steps.check.outputs.has_vulns == 'false'
        run: |
          echo "✅ npm audit is clean - no vulnerabilities found"
