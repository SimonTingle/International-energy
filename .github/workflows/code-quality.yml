name: Code Quality & Type Check

on:
  push:
    branches: [main, develop, claude/**]
  pull_request:
    branches: [main, develop]

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npx tsc --noEmit

      - name: Check for type errors
        run: |
          if npx tsc --noEmit > /dev/null 2>&1; then
            echo "✅ TypeScript checks passed"
          else
            echo "❌ TypeScript errors found"
            npx tsc --noEmit
            exit 1
          fi

  eslint:
    name: ESLint Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint -- --format=json --output-file=eslint-report.json || true
        continue-on-error: true

      - name: Comment ESLint results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const report = JSON.parse(fs.readFileSync('eslint-report.json', 'utf8'));
              const errors = report.reduce((sum, file) => sum + file.errorCount, 0);
              const warnings = report.reduce((sum, file) => sum + file.warningCount, 0);

              if (errors > 0) {
                core.setFailed(`ESLint found ${errors} error(s) and ${warnings} warning(s)`);
              } else {
                core.info(`✅ ESLint: ${warnings} warning(s)`);
              }
            } catch (e) {
              core.debug('No ESLint report found');
            }

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build 2>&1 | tail -50
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_ENV: 'production'

      - name: Check build output
        run: |
          if [ -d ".next" ]; then
            echo "✅ Next.js build successful"
            du -sh .next
          else
            echo "❌ Build failed - .next directory not found"
            exit 1
          fi
