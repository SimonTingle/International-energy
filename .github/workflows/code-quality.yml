name: Code Quality & Type Check

on:
  push:
    branches: [main, develop, claude/**]
  pull_request:
    branches: [main, develop]

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # FIX #1: Removed duplicate "Run TypeScript compiler" step.
      # The old workflow ran npx tsc --noEmit twice — step 4 would exit 1
      # on errors, stopping the job before step 5 ever ran.
      - name: Check for type errors
        run: |
          if npx tsc --noEmit 2>&1; then
            echo "✅ TypeScript checks passed"
          else
            echo "❌ TypeScript errors found"
            exit 1
          fi

  eslint:
    name: ESLint Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # FIX #2: next lint does not forward --format or --output-file flags.
      # Run next lint for pass/fail, then run npx eslint separately for JSON report.
      - name: Run ESLint (next lint)
        run: npm run lint
        continue-on-error: true

      - name: Generate ESLint JSON report
        run: npx eslint . --ext .ts,.tsx --format=json --output-file=eslint-report.json || true
        continue-on-error: true

      - name: Report ESLint results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const report = JSON.parse(fs.readFileSync('eslint-report.json', 'utf8'));
              const errors = report.reduce((sum, file) => sum + file.errorCount, 0);
              const warnings = report.reduce((sum, file) => sum + file.warningCount, 0);
              if (errors > 0) {
                core.setFailed(`ESLint found ${errors} error(s) and ${warnings} warning(s)`);
              } else {
                core.info(`✅ ESLint: ${warnings} warning(s), 0 errors`);
              }
            } catch (e) {
              core.debug('No ESLint JSON report found');
            }

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # FIX #3: Piping through `tail` swallowed the build exit code —
      # a failing build appeared to pass. Use pipefail so the pipe
      # propagates npm run build's exit code correctly.
      - name: Build project
        run: |
          set -o pipefail
          npm run build 2>&1 | tail -60
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_ENV: 'production'

      - name: Check build output
        run: |
          if [ -d ".next" ]; then
            echo "✅ Next.js build successful"
            du -sh .next
          else
            echo "❌ Build failed - .next directory not found"
            exit 1
          fi
